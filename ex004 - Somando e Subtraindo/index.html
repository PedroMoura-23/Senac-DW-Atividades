<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cálculos</title>
  </head>
  <body>
    <h1>Somando Valores</h1>
    <p>
      <input type="number" name="" id="Anum1" /> +
      <input type="number" name="" id="Anum2" /> <input type="button" value="Somar" onclick="soma()"/>
      <p id="Resultado1">Resultado</p>
    </p>
    <h1>Subtrair Valores</h1>
    <p>
      <input type="number" name="" id="Snum1" /> -
      <input type="number" name="" id="Snum2" /> <input type="button" value="Subtrair" onclick="subtrai()"/>
      <p id="Resultado2">Resultado</p>
    </p>
    <script src="script.js"></script>
  </body>
</html>
