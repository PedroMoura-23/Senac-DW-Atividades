<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>
    <form action="" return false onsubmit="cadastro()">
        <fieldset>

            <p>
                <legend>Cadrasto de ususario
                </legend>
                <label for="">Primeiro nome
                </label>
                <input type="" name="" id="p_nome" required>
            </p>

            <p>
                <label for="">Ultimo nome</label>
                <input type="text" name="" id="u_nome">

            </p>

            <p>
                <label for="">Senha</label>
                <input type="password" name="" id="">
            </p>

            <p>
                <label for="">Sexo</label>
                <input type="radio" name="Sexo" id="masc">
                <label for="">Masculino</label>
                <input type="radio" name="Sexo" id="femi">
                <label for="femi">feminino</label>
            </p>

            <p>
                <label for="">Possui alguma deficiencia?</label>
            </p>
            <p>
                <input type="checkbox" name="" id="" value="Visão">
                <label for="Visão">Visão</label>
                <input type="checkbox" name="" id="" value="Audição">
                <label for="Audição">Audição</label>
                <input type="checkbox" name="" id="" value="Fala">
                <label for="Fala">Fala</label>
            </p>

            <p>
                <label for="">Data de Nascimento</label>
                <input type="date" name="" id="">
            </p>

            <p>
                <label for="">Email</label>
                <input type="email">
            </p>

            <p>
                <label for="">Dúvidas</label>
                <textarea name="" id="" cols="30" rows="10" placeholder="Digite aqui a sua Duvida"></textarea>
            </p>
            <p>
                <label for="">Raça</label>
                <select name="" id="">
                    <option value="">Pardo</option>
                    <option value="">Negro</option>
                    <option value="">Branco</option>
                    <option value="">Indigena</option>
                    <option value="">Amarelo</option>
                    <option value="">Extraterrestre</option>
                </select>
            </p>


            <input type="submit">
        </fieldset>
    </form>
    <div id="resultado">

    </div>

    <script src="script.js"></script>
</body>

</html>
